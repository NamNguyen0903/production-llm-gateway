services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: llm_gateway_test
      POSTGRES_USER: gateway_test
      POSTGRES_PASSWORD: gateway_test_local
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U gateway_test -d llm_gateway_test
      interval: 2s
      timeout: 3s
      retries: 15